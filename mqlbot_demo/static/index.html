<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MQL_PLMate — Bot Simulator</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --text: #1d2330; --muted: #6b7385;
    --bot: #ffffff; --user: #2f6fed; --user-text: #ffffff; --border: #d9dee7;
    --accent: #2f6fed; --good: #1f9d55; --warn: #c27c0e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1a1f29; --text: #e6e9ef; --muted: #8d95a8;
      --bot: #232a36; --user: #3d7bf2; --user-text: #ffffff; --border: #2c3442;
      --accent: #6b9bff; --good: #47c27d; --warn: #e3a33b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--panel); border-inline: 1px solid var(--border); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  header .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  #chat { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; font-size: 14px; }
  .bot { background: var(--bot); border: 1px solid var(--border); align-self: flex-start; border-top-left-radius: 4px; }
  .user { background: var(--user); color: var(--user-text); align-self: flex-end; border-top-right-radius: 4px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .card .section { margin-top: 8px; }
  .card .label { font-weight: 600; font-size: 13px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; margin-right: 4px; }
  .badge.open { color: var(--warn); } .badge.done { color: var(--good); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 18px 0; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  form { display: flex; gap: 8px; padding: 12px 18px 16px; }
  input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
  button[type=submit] { padding: 10px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  .actions { margin-top: 8px; }
  .actions button { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">M</div>
    <div><h1>MQL_PLMate <small style="color:var(--muted);font-weight:400">(demo)</small></h1>
    <p>Mock data only · Try “wifi”, “network slicing”, or DEMO-000101</p></div>
  </header>
  <div id="chat"></div>
  <div class="chips">
    <button class="chip active" data-mode="sme">🔍 SME Finder</button>
    <button class="chip" data-mode="plm">📌 PLM Issue Lookup</button>
  </div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Enter a technical keyword…">
    <button type="submit">Send</button>
  </form>
</div>
<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
let mode = "sme";
const placeholders = { sme: "Enter a technical keyword…", plm: "Enter a PLM issue number (e.g. DEMO-000101)…" };

function add(content, who = "bot", isHtml = false) {
  const div = document.createElement("div");
  div.className = `msg ${who}`;
  if (isHtml) div.innerHTML = content; else div.textContent = content;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function post(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  return res.json();
}

async function searchSME(q) {
  const data = await post("/api/find-sme", { query: q, top_k: 5 });
  add(data.formatted_result || "Search failed.");
}

function issueCard(o) {
  const statusClass = o.plmStatus === "Open" ? "open" : "done";
  const section = (label, text) => `<div class="section"><div class="label">${label}</div>${esc(text)}</div>`;
  return `<div class="card">
    <h3>📌 ${esc(o.issueNumber)}</h3>
    <div>${esc(o.plmTitle)}</div>
    <div class="meta"><span class="badge ${statusClass}">${esc(o.plmStatus)}</span><span class="badge">Priority ${esc(o.priority)}</span>
      ${esc(o.createUserName)} (${esc(o.createUser)}) · ${esc(o.regDate)} · 📁 ${esc(o.refObjectName)}</div>
    ${section("📋 Description", o.description)}
    ${section("🔍 Cause", o.cause)}
    ${section("🔧 Countermeasure", o.countermeasure)}
    ${o.latestComment ? section("💬 Latest Comment", o.latestComment) : ""}
    ${o.attachmentsText ? section("Attachments", o.attachmentsText) : ""}
    ${o.warnings ? `<div class="meta">⚠️ ${esc(o.warnings.join(", "))}</div>` : ""}
    <div class="actions"><button data-summary>✨ Summarize (KO/EN)</button></div>
  </div>`;
}

async function lookupIssue(n) {
  const data = await post("/api/aibuilder/issue-lookup", { issueNumber: n });
  const o = data.output || {};
  if (!o.found) { add(o.message || "Issue not found."); return; }
  const el = add(issueCard(o), "bot", true);
  el.querySelector("[data-summary]").addEventListener("click", async e => {
    e.target.disabled = true;
    const s = await post("/api/aibuilder/ai-summary", { text: o.description, issue_number: o.issueNumber, cause: o.cause, countermeasure: o.countermeasure });
    add(s.success ? `✨ Summary (${s.engine})\n\n[KO]\n${s.summary_ko}\n\n[EN]\n${s.summary_en}` : `Summary failed: ${s.error}`);
  });
}

document.querySelectorAll(".chip").forEach(chip => chip.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  mode = chip.dataset.mode;
  input.placeholder = placeholders[mode];
  input.focus();
}));

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const value = input.value.trim();
  if (!value) return;
  add(value, "user");
  input.value = "";
  try { mode === "sme" ? await searchSME(value) : await lookupIssue(value); }
  catch (err) { add("⚠️ Server error: " + err.message); }
});

add("Hi! I'm MQL_PLMate 👋\nFind a subject matter expert by keyword, or look up a PLM issue by number.\n(This demo runs entirely on mock data.)");
</script>
</body>
</html>
