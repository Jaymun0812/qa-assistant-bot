name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: pip install -r requirements-demo.txt
      - name: Run tests with coverage
        run: pytest --cov=mqlbot_demo --cov-report=term-missing --cov-fail-under=85
      - name: Run alert demo
        run: python -m mqlbot_demo.alerts --now 2026-11-10T09:00 --quiet
